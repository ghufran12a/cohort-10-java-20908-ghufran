# Used ONLY when the "sqlserver" profile is switched on. These lines override application.properties,
# everything else (JWT, CORS...) stays the same. Java code does not change at all: that is the benefit of JPA.
#
# PowerShell:  $env:SPRING_PROFILES_ACTIVE = "sqlserver"
#
# trustServerCertificate=true is for a LOCAL development server only, never for a real server.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contact_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:contact_user}
spring.datasource.password=${DB_PASSWORD}

# our SQL Server columns are NVARCHAR, so Hibernate must treat Java Strings as NVARCHAR too
spring.jpa.properties.hibernate.use_nationalized_character_data=true
