spring.application.name=contact-manager

# --- Database (MySQL) ---
# MySQL is the default. For SQL Server: run db/schema-sqlserver.sql and switch on the "sqlserver" profile
# (its settings are in application-sqlserver.properties).
spring.datasource.url=jdbc:mysql://localhost:3306/contact_db
spring.datasource.username=contact_user
# Password comes from the DB_PASSWORD environment variable, never hard-code it (this file goes to GitHub)
spring.datasource.password=${DB_PASSWORD}

# --- JWT (login tokens) ---
# The secret signs every token. It comes from an environment variable (min 32 characters), never from GitHub.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
# The React app's address, allowed to call this API (CORS)
app.cors.allowed-origin=http://localhost:5173

# --- JPA / Hibernate ---
# validate = only CHECK that tables match our Java classes (tables are created by backend/db/schema.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Load emails/phones of many contacts in a few queries instead of one query per contact (avoids the "N+1" problem)
spring.jpa.properties.hibernate.default_batch_fetch_size=20
