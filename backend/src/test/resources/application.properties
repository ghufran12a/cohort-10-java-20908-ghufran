# Settings used ONLY by tests. They replace src/main/resources/application.properties.
spring.application.name=contact-manager

# In-memory H2 database: created fresh for the tests and thrown away afterwards (our real MySQL is never touched)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates the tables from our entities
spring.jpa.hibernate.ddl-auto=create-drop

# A throw-away secret for tests only (NOT the real one)
app.jwt.secret=test-only-secret-key-that-is-at-least-32-characters
app.jwt.expiration-minutes=60
app.cors.allowed-origin=http://localhost:5173
